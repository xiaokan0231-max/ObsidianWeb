# 代码门禁含构建与 Worker 首屏；模型下载显式跳过，不依赖 Google 网络。
# vault 是独立外部数据，仍不加入 CI（见 CLAUDE.md「自动检查装在哪」）。
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - run: node scripts/fetch-mediapipe.mjs --skip-model-download
      - run: npm run build:app
      - run: npm run test:built
