# 与本地共用 npm test，并验证 package.json 声明的最低 Node 版本。
# vault 是独立外部数据，仍不加入 CI（见 CLAUDE.md「自动检查装在哪」）。
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
